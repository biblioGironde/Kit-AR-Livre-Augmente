# Publie l'appli web (dossier www/) sur https://bibliogironde.github.io/Kit-AR-Livre-Augmente/
# Fonctionne quelle que soit la source choisie dans Settings → Pages :
#  - « GitHub Actions » : déploiement direct (job deploy)
#  - « Deploy from a branch » gh-pages : branche mise à jour (job branche)
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: touch www/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploiement
        uses: actions/deploy-pages@v4

  branche:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publier www/ sur gh-pages
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
